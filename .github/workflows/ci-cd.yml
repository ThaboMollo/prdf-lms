name: CI-CD

on:
  push:
    branches:
      - main
      - phase-*
  pull_request:
    branches:
      - main

jobs:
  # Applies the real migration chain to a throwaway Postgres and asserts the
  # RLS policies actually enforce what they claim (spec §6.6). Independent of
  # the build job, so a policy regression fails CI on its own.
  rls-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RLS assertion suite
        run: ./infra/supabase/tests/run.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            client-ui/package-lock.json
            admin-ui/package-lock.json
            backend-node/package-lock.json

      - name: Install API
        run: npm ci
        working-directory: backend-node

      - name: Build API
        run: npm run build
        working-directory: backend-node

      # Upload type/path validation (spec §6.3). Runs against the compiled
      # output, so it must follow the build step.
      - name: Test file validation
        run: node scripts/test-file-validation.mjs
        working-directory: backend-node

      # MFA enforcement (spec §6.5). The critical assertion is that the
      # feature flag defaults to blocking nobody — a regression there would
      # lock every staff account out of the API on deploy.
      - name: Test MFA enforcement
        run: node scripts/test-mfa-enforcement.mjs
        working-directory: backend-node

      - name: Install client UI
        run: npm ci
        working-directory: client-ui

      # Enforces platform-architecture-design.md §3.4: "the browser never
      # talks to Supabase for data." lib/supabase/client.ts is the one
      # legitimate exception (session management only). Excludes
      # Array.from(...) — the only false-positive match found when this
      # check was introduced.
      - name: Check for direct Supabase data access in client UI
        run: |
          matches=$(grep -rPn '(?<!Array)\.from\(|\.storage\.from\(' src --include='*.ts' --include='*.tsx' | grep -v 'lib/supabase/client.ts' || true)
          if [ -n "$matches" ]; then
            echo "Found direct Supabase data access outside lib/supabase/client.ts:"
            echo "$matches"
            exit 1
          fi
        working-directory: client-ui

      - name: Build client UI
        run: npm run build
        working-directory: client-ui

      - name: Install admin UI
        run: npm ci
        working-directory: admin-ui

      # Same enforcement as client UI, above.
      - name: Check for direct Supabase data access in admin UI
        run: |
          matches=$(grep -rPn '(?<!Array)\.from\(|\.storage\.from\(' src --include='*.ts' --include='*.tsx' | grep -v 'lib/supabase/client.ts' || true)
          if [ -n "$matches" ]; then
            echo "Found direct Supabase data access outside lib/supabase/client.ts:"
            echo "$matches"
            exit 1
          fi
        working-directory: admin-ui

      - name: Build admin UI
        run: npm run build
        working-directory: admin-ui
