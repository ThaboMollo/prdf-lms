name: CI-CD

on:
  push:
    branches:
      - main
      - phase-*
  pull_request:
    branches:
      - main

jobs:
  # Applies the real migration chain to a throwaway Postgres and asserts the
  # RLS policies actually enforce what they claim (spec §6.6). Independent of
  # the build job, so a policy regression fails CI on its own.
  rls-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RLS assertion suite
        run: ./infra/supabase/tests/run.sh


  # Every tenant must run a byte-identical schema. One tenant silently a
  # migration behind is invisible otherwise — there was no migration tracking
  # at all before this. Needs tenant DB URLs as repository secrets; skips with
  # a clear message rather than failing the build if they are not configured.
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tenant schema drift
        env:
          TENANTS: ${{ secrets.TENANTS }}
          TENANT_PRDF_DB_URL: ${{ secrets.TENANT_PRDF_DB_URL }}
          SUPABASE_DB_CONNECTION_STRING: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
        run: |
          if [ -z "$TENANTS" ] && [ -z "$SUPABASE_DB_CONNECTION_STRING" ]; then
            echo "No tenant database secrets configured — skipping drift check."
            echo "Set TENANTS + TENANT_<SLUG>_DB_URL (or SUPABASE_DB_CONNECTION_STRING) to enable it."
            exit 0
          fi
          ./infra/scripts/migrate-all.sh --status


  # Business logic and authorization through the real HTTP surface (item T2).
  # Boots the actual API against a real Postgres with real signed tokens — the
  # authorization bugs found in this project were all invisible to unit-level
  # reasoning and only showed up end to end.
  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create test roles
        run: |
          psql -d postgres -c "create role prdf_test_owner login createdb password 'prdf_owner_pw';" || true
          psql -d postgres -c "do \$\$ begin
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin noinherit; end if;
          end \$\$;"

      - name: Install API
        run: npm ci
        working-directory: backend-node

      # docs/validation-spec.md workstream B. backend-node/src cannot import
      # packages/domain (its tsconfig `include` stops at src/), so the shared
      # constraints are mirrored in by a generator. Unchecked, that copy would
      # drift — which is the exact problem the shared definition exists to fix,
      # reproduced one level down. Runs BEFORE the build so a stale mirror fails
      # here with a clear message rather than as a confusing test failure.
      - name: Check constraint drift
        run: node scripts/generate-constraints.mjs --check
        working-directory: backend-node

      - name: Build API
        run: npm run build
        working-directory: backend-node

      - name: Run API integration suite
        run: node scripts/test-api-integration.mjs
        working-directory: backend-node

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vercel picks the package manager from whichever lockfile it finds, and
      # yarn.lock WINS over package-lock.json. Both apps carried both, so
      # production was building with `yarn install v1.22.19` while this workflow
      # ran `npm ci` — two different resolvers, meaning a green CI build never
      # actually proved the tree production would install. That is the same
      # class of gap that shipped a duplicate React and took client-ui down.
      #
      # Checked before any install so it fails fast and unambiguously.
      - name: Enforce a single package manager (npm)
        run: |
          strays=$(find . -name yarn.lock -o -name pnpm-lock.yaml -o -name '.yarnrc*' \
            | grep -v node_modules || true)
          if [ -n "$strays" ]; then
            echo "Non-npm package manager files present:"
            echo "$strays"
            echo
            echo "Vercel would build with that package manager instead of npm,"
            echo "diverging from this workflow. Remove them, or move CI to match."
            exit 1
          fi
          for app in client-ui admin-ui backend-node; do
            if [ ! -f "$app/package-lock.json" ]; then
              echo "$app has no package-lock.json — npm ci cannot pin its tree."
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            client-ui/package-lock.json
            admin-ui/package-lock.json
            backend-node/package-lock.json

      - name: Install API
        run: npm ci
        working-directory: backend-node

      - name: Build API
        run: npm run build
        working-directory: backend-node

      # Upload type/path validation (spec §6.3). Runs against the compiled
      # output, so it must follow the build step.
      - name: Test file validation
        run: node scripts/test-file-validation.mjs
        working-directory: backend-node

      # MFA enforcement (spec §6.5). The critical assertion is that the
      # feature flag defaults to blocking nobody — a regression there would
      # lock every staff account out of the API on deploy.
      - name: Test MFA enforcement
        run: node scripts/test-mfa-enforcement.mjs
        working-directory: backend-node

      # Tenancy guard rails (docs/multi-tenant-spec.md §4/§5). These assert the
      # refusal paths — half-configured tenants, ambiguous issuers, guessed
      # resolution, default pools. Every one of those is a route to reading the
      # wrong tenant's database.
      - name: Test tenancy guard rails
        run: node scripts/test-tenancy.mjs
        working-directory: backend-node

      # Under multi-tenancy these credentials belong to a REQUEST, not the
      # process. Reading them from the environment inside a service mints
      # credentials for whichever tenant the process was configured with —
      # e.g. signing a storage URL against the wrong tenant's bucket. Only the
      # tenancy registry may touch them; everything else uses currentTenant().
      - name: Check service-role credentials are tenant-scoped
        run: |
          matches=$(grep -rn "process\.env\.SUPABASE_\(URL\|SERVICE_ROLE_KEY\|DB_CONNECTION_STRING\)" src --include='*.ts' | grep -v '^src/tenancy/' || true)
          if [ -n "$matches" ]; then
            echo "Tenant credentials read from process.env outside src/tenancy/:"
            echo "$matches"
            echo ""
            echo "Use currentTenant() from src/tenancy/request-context instead."
            exit 1
          fi
          echo "All tenant credentials are resolved from request context."
        working-directory: backend-node

      - name: Install client UI
        run: npm ci
        working-directory: client-ui

      # Enforces platform-architecture-design.md §3.4: "the browser never
      # talks to Supabase for data." lib/supabase/client.ts is the one
      # legitimate exception (session management only). Excludes
      # Array.from(...) — the only false-positive match found when this
      # check was introduced.
      - name: Check for direct Supabase data access in client UI
        run: |
          matches=$(grep -rPn '(?<!Array)\.from\(|\.storage\.from\(' src --include='*.ts' --include='*.tsx' | grep -v 'lib/supabase/client.ts' || true)
          if [ -n "$matches" ]; then
            echo "Found direct Supabase data access outside lib/supabase/client.ts:"
            echo "$matches"
            exit 1
          fi
        working-directory: client-ui

      - name: Build client UI
        run: npm run build
        working-directory: client-ui

      # Frontend tenant routing (docs/multi-tenant-spec.md §W7). The dangerous
      # failure is not an error — it is resolving to the WRONG tenant, which
      # would serve one client's branding and login form on another client's
      # domain. Needs client-ui's node_modules for esbuild, so it runs after
      # that install.
      - name: Test tenant resolution
        run: node packages/tenant-config/test-resolution.mjs

      # Field-level error parsing (docs/validation-spec.md §C1). Guards the
      # regression this replaced: stringifying the response body into an Error
      # message, which silently discarded the server's per-field `errors` and
      # left every form able to show only a banner. Same esbuild dependency as
      # the step above.
      - name: Test API error parsing
        run: node packages/domain/test-api-error.mjs

      # Form error routing (docs/validation-spec.md §C2). Asserts a rejection
      # lands in the right place: attributable ones on the field, everything
      # else in the banner — never both, never neither.
      - name: Test form error routing
        run: node packages/ui-kit/test-form-errors.mjs

      # Numeric input parsing (docs/validation-spec.md §D). Guards the failure
      # that made this component necessary: type="number" reports '' for content
      # it dislikes, and Number('') is 0 — a silent, plausible wrong figure on a
      # loan amount rather than a visible error.
      - name: Test numeric input parsing
        run: node packages/ui-kit/test-numeric-input.mjs

      - name: Install admin UI
        run: npm ci
        working-directory: admin-ui

      # Same enforcement as client UI, above.
      - name: Check for direct Supabase data access in admin UI
        run: |
          matches=$(grep -rPn '(?<!Array)\.from\(|\.storage\.from\(' src --include='*.ts' --include='*.tsx' | grep -v 'lib/supabase/client.ts' || true)
          if [ -n "$matches" ]; then
            echo "Found direct Supabase data access outside lib/supabase/client.ts:"
            echo "$matches"
            exit 1
          fi
        working-directory: admin-ui

      - name: Build admin UI
        run: npm run build
        working-directory: admin-ui

      # A duplicate React inside packages/*/node_modules bundles TWO React
      # copies, which builds cleanly and then fails at runtime with
      # "null is not an object (evaluating 'useState')" — the whole app dies
      # behind the ErrorBoundary. This shipped to production once: npm >=7
      # auto-installs peerDependencies, so `npm install` inside packages/ui-kit
      # was enough to cause it. Peers are now optional and Vite dedupes, but a
      # green build is not evidence the app runs, so this is checked directly.
      - name: Check for duplicated React (runtime-breaking, build-invisible)
        run: |
          fail=0
          for pkg in react react-dom react-router-dom @tanstack/react-query @supabase/supabase-js; do
            hits=$(find packages -maxdepth 4 -path "*/node_modules/$pkg" -type d 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "Stateful singleton installed inside a package (will duplicate in the bundle):"
              echo "$hits"
              fail=1
            fi
          done
          for app in client-ui admin-ui; do
            bundle=$(ls $app/dist/assets/index-*.js 2>/dev/null | head -1)
            [ -z "$bundle" ] && continue
            versions=$(grep -o '19\.[0-9]*\.[0-9]*' "$bundle" | sort -u | wc -l | tr -d ' ')
            if [ "$versions" -gt 1 ]; then
              echo "$app bundle contains more than one React version:"
              grep -o '19\.[0-9]*\.[0-9]*' "$bundle" | sort -u
              fail=1
            fi
          done

          # Every bare specifier imported by a source-consumed package must be
          # in each app's vite `dedupe` list — those packages have no
          # node_modules of their own, so Vite has nothing to resolve against
          # otherwise. A missing entry either fails the build outright
          # ("Could not resolve X imported by ui-kit") or, if it happens to
          # resolve elsewhere, silently duplicates a singleton.
          imports=$(grep -rhoE "from '[^.'][^']*'" packages/ui-kit packages/client-core packages/domain packages/tenant-config --include='*.ts' --include='*.tsx' 2>/dev/null | sed "s/from '//;s/'//" | sort -u)
          for app in client-ui admin-ui; do
            for imp in $imports; do
              if ! grep -q "'$imp'" $app/vite.config.ts; then
                echo "$app/vite.config.ts is missing '$imp' from resolve.dedupe (imported by packages/*)"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "dedupe list covers all package imports."
          exit $fail
