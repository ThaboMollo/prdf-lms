name: Notification Sweep

# Vercel's Cron Jobs are limited to once-daily on Hobby-tier accounts, which
# doesn't cover the hourly schedule this needs — so this triggers the
# endpoint from GitHub Actions instead, mirroring uptime-check.yml's
# existing scheduled-workflow pattern in this repo.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification sweep
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            exit 1
          fi
          # Assert an explicit 200 rather than relying on `curl --fail`,
          # which only fails on 4xx/5xx — a 3xx passes it. This workflow
          # silently "succeeded" for months against a team-scoped Vercel
          # URL that 302-redirected to SSO login, meaning the sweep never
          # actually ran and no arrears notification ever fired.
          status=$(curl --silent --show-error --output /tmp/body.txt \
            --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_HEALTH_URL/internal/cron/notification-sweep")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" != "200" ]; then
            echo "Expected HTTP 200 from the sweep endpoint, got $status."
            exit 1
          fi
